# Docker-first workflow — no local virtualenv.
#
#   docker compose build
#   docker compose run --rm agent check
#   docker compose run --rm agent go "Login and fill the form"
#   docker compose run --rm --entrypoint pytest agent -q
#
# The `agent` is a one-shot: it exits when its command finishes (that's expected
# and why it "disappears").
#
# The source is bind-mounted so edits are picked up without rebuilding
# (the package is installed with `pip install -e .`).

services:
  agent:
    build: .
    image: bta:dev
    volumes:
      - .:/app
      # X11 socket so headed Chromium can draw to the host desktop (Linux/X11).
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      # ── Browser ────────────────────────────────────────────────────────────
      # Chromium runs headless by default; override per-run with
      #   -e BTA_HEADLESS=false   to watch the browser on your screen.
      BTA_HEADLESS: "${BTA_HEADLESS:-true}"
      BTA_RESULTS_DIR: "/app/results"
      # Slow actions down (ms) so a headed run is watchable, e.g. -e BTA_SLOWMO_MS=500
      BTA_SLOWMO_MS: "${BTA_SLOWMO_MS:-0}"
      BTA_NAV_TIMEOUT_MS: "${BTA_NAV_TIMEOUT_MS:-30000}"
      BTA_ACTION_TIMEOUT_MS: "${BTA_ACTION_TIMEOUT_MS:-10000}"
      BTA_SHOW_EVIDENCE: "${BTA_SHOW_EVIDENCE:-true}"
      # Host display for headed mode (X11).
      DISPLAY: "${DISPLAY:-}"

      # ── Agent (Claude Agent SDK) ────────────────────────────────────────────
      # The SDK reads ANTHROPIC_API_KEY; model/effort are optional overrides.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      BTA_MODEL: "${BTA_MODEL:-claude-sonnet-5}"
      BTA_EFFORT: "${BTA_EFFORT:-high}"
      # Optional third-party gateway (e.g. OpenRouter). Set these + BTA_MODEL to a
      # provider slug to route the SDK elsewhere; leave blank for Anthropic direct.
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"

      # ── Application under test ──────────────────────────────────────────────
      # BTA_BASE_URL is the application URL — distinct from ANTHROPIC_BASE_URL
      # (the model gateway). Required for `bta check`.
      BTA_BASE_URL: "${BTA_BASE_URL:-}"
      BTA_LOGIN_URL: "${BTA_LOGIN_URL:-}"

      # ── Test credentials (optional — supply both or neither) ────────────────
      BTA_TEST_USERNAME: "${BTA_TEST_USERNAME:-}"
      BTA_TEST_PASSWORD: "${BTA_TEST_PASSWORD:-}"

      # ── Auth state and context files ────────────────────────────────────────
      BTA_AUTH_STATE: "${BTA_AUTH_STATE:-}"
      BTA_AUTH_NOTES_FILE: "${BTA_AUTH_NOTES_FILE:-}"
      BTA_TEST_DATA_FILE: "${BTA_TEST_DATA_FILE:-}"

      # ── Scope and budget ────────────────────────────────────────────────────
      BTA_ALLOWED_ORIGINS: "${BTA_ALLOWED_ORIGINS:-}"
      BTA_ALLOW_MUTATIONS: "${BTA_ALLOW_MUTATIONS:-false}"
      BTA_DEPTH: "${BTA_DEPTH:-medium}"
      BTA_MAX_SECONDS: "${BTA_MAX_SECONDS:-}"
      BTA_MAX_ACTIONS: "${BTA_MAX_ACTIONS:-}"
      BTA_MAX_COST_USD: "${BTA_MAX_COST_USD:-}"
    # Give Chromium enough shared memory to avoid crashes on heavy pages.
    shm_size: "1gb"
