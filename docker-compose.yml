# Docker-first workflow — no local virtualenv.
#
#   docker compose build
#   docker compose run --rm agent check
#   docker compose run --rm agent go "Login and fill the form"
#   docker compose run --rm --entrypoint pytest agent -q
#
# The `agent` is a one-shot: it exits when its command finishes (that's expected
# and why it "disappears").
#
# The source is bind-mounted so edits are picked up without rebuilding
# (the package is installed with `pip install -e .`).

services:
  agent:
    build: .
    image: assay:dev
    volumes:
      - .:/app
      # X11 socket so headed Chromium can draw to the host desktop (Linux/X11).
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      # ── Browser ────────────────────────────────────────────────────────────
      # Chromium runs headless by default; override per-run with
      #   -e ASSAY_HEADLESS=false   to watch the browser on your screen.
      ASSAY_HEADLESS: "${ASSAY_HEADLESS:-true}"
      ASSAY_RESULTS_DIR: "/app/results"
      # Slow actions down (ms) so a headed run is watchable, e.g. -e ASSAY_SLOWMO_MS=500
      ASSAY_SLOWMO_MS: "${ASSAY_SLOWMO_MS:-0}"
      ASSAY_NAV_TIMEOUT_MS: "${ASSAY_NAV_TIMEOUT_MS:-30000}"
      ASSAY_ACTION_TIMEOUT_MS: "${ASSAY_ACTION_TIMEOUT_MS:-10000}"
      ASSAY_SHOW_EVIDENCE: "${ASSAY_SHOW_EVIDENCE:-true}"
      # Host display for headed mode (X11).
      DISPLAY: "${DISPLAY:-}"

      # ── Agent (Claude Agent SDK) ────────────────────────────────────────────
      # The SDK reads ANTHROPIC_API_KEY; model/effort are optional overrides.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ASSAY_MODEL: "${ASSAY_MODEL:-claude-sonnet-5}"
      ASSAY_EFFORT: "${ASSAY_EFFORT:-high}"
      # Optional third-party gateway (e.g. OpenRouter). Set these + ASSAY_MODEL to a
      # provider slug to route the SDK elsewhere; leave blank for Anthropic direct.
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"

      # ── Application under test ──────────────────────────────────────────────
      # ASSAY_BASE_URL is the application URL — distinct from ANTHROPIC_BASE_URL
      # (the model gateway). Required for `assay check`.
      ASSAY_BASE_URL: "${ASSAY_BASE_URL:-}"
      ASSAY_LOGIN_URL: "${ASSAY_LOGIN_URL:-}"

      # ── Test credentials (optional — supply both or neither) ────────────────
      ASSAY_TEST_USERNAME: "${ASSAY_TEST_USERNAME:-}"
      ASSAY_TEST_PASSWORD: "${ASSAY_TEST_PASSWORD:-}"

      # ── Auth state and context files ────────────────────────────────────────
      ASSAY_AUTH_STATE: "${ASSAY_AUTH_STATE:-}"
      ASSAY_AUTH_NOTES_FILE: "${ASSAY_AUTH_NOTES_FILE:-}"
      ASSAY_TEST_DATA_FILE: "${ASSAY_TEST_DATA_FILE:-}"

      # ── Scope and budget ────────────────────────────────────────────────────
      ASSAY_ALLOWED_ORIGINS: "${ASSAY_ALLOWED_ORIGINS:-}"
      ASSAY_ALLOW_MUTATIONS: "${ASSAY_ALLOW_MUTATIONS:-false}"
      ASSAY_DEPTH: "${ASSAY_DEPTH:-medium}"
      ASSAY_MAX_SECONDS: "${ASSAY_MAX_SECONDS:-}"
      ASSAY_MAX_ACTIONS: "${ASSAY_MAX_ACTIONS:-}"
      ASSAY_MAX_COST_USD: "${ASSAY_MAX_COST_USD:-}"
    # Give Chromium enough shared memory to avoid crashes on heavy pages.
    shm_size: "1gb"
